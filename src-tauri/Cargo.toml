[workspace]
members = [
  ".",
  "crates/ministudio-audio",
  "crates/ministudio-contracts",
  "crates/ministudio-dsp",
  "crates/ministudio-plugin",
]
resolver = "2"

[patch.crates-io]
# Keep VST3 loading tolerant of vendor bundles whose optional compatibility
# table references a retired/non-audio class (notably Spitfire BBC SO).
vst3-host = { path = "vendor/vst3-host" }

[package]
name = "ministudio-app"
version = "0.2.0"
description = "A compact native-audio digital audio workstation"
authors = ["MiniStudio contributors"]
edition = "2021"

[lib]
name = "ministudio_lib"
# MiniStudio is a desktop application. Keeping this as an rlib avoids producing
# unused mobile library artifacts (and an oversized GNU DLL export table).
crate-type = ["rlib"]

[[bin]]
name = "ministudio"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["desktop"]
desktop = ["tauri/wry"]
# Enabling cpal/asio pulls the Steinberg ASIO SDK and makes that build GPLv3.
asio = ["ministudio-audio/asio"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
bytemuck = "1.24"
ministudio-audio = { path = "crates/ministudio-audio" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.11", default-features = false, features = ["specta", "test", "unstable"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.dev]
opt-level = 0
debug = 1
# Keep local edit/rebuild cycles fast. If the cache is ever corrupted, clear it
# once and check antivirus/indexer exclusions instead of disabling incrementals.
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 0
debug = 1
incremental = true

[profile.test.package."*"]
debug = false

# Tauri dev uses this profile: optimize MiniStudio's realtime DSP, but leave the
# large GUI dependency graph cheap to compile.
[profile.dev-dsp]
inherits = "dev"
opt-level = 2
debug = 1
# rust-lld is kept for fast links, but this profile must not reuse per-CGU
# incremental LLVM objects. A stale mix can link references to anonymous
# symbols from a different compilation session (observed as undefined
# `anon.*.llvm.*` symbols). The layered workspace keeps warm rebuilds small.
incremental = false

[profile.dev-dsp.package."*"]
opt-level = 0
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The application package remains at the src-tauri root because Tauri resolves
# its manifest, build script, capabilities, and configuration from this path.
